name: Release

# Builds the Confluent Hub connector zip and attaches it to the GitHub release.
# Runs when a release is published. Use "Run workflow" with a tag to backfill
# an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the zip to (e.g. v1.0.6)
        required: true

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Check pom version matches tag
        run: |
          POM_VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v${POM_VERSION}" != "${TAG}" ]; then
            echo "::error::pom.xml version ${POM_VERSION} does not match tag ${TAG}"
            exit 1
          fi

      - name: Build connector zip
        # Integration tests need Timeplus/Proton containers, so only unit tests run here.
        run: mvn -B package -Dtest=TimeplusSinkTaskTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" target/components/packages/*.zip --clobber
